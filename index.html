<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Up</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%274%27 y=%276%27 width=%2756%27 height=%2752%27 fill=%27%23f2b705%27 transform=%27rotate(-4 32 32)%27/%3E%3Ctext x=%2732%27 y=%2746%27 text-anchor=%27middle%27 font-family=%27Arial Black,Arial%27 font-weight=%27900%27 font-size=%2738%27 fill=%27%23111%27%3ESU%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 4'%3E%3Crect width='3' height='4' fill='%23e5322d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand" aria-label="Show Up"><b class="wm"><span>SHOW</span><span>UP</span></b></div>
    <nav class="nav">
      <button data-view="today" class="navb">Today</button>
      <button data-view="challenges" class="navb">New</button>
      <button data-view="wall" class="navb">Wall</button>
    </nav>
    <div class="side-streak" id="sideStreak"></div>
    <div class="side-run" id="sideRun" hidden></div>
  </aside>

  <main class="main" id="main">
    <section class="view" id="v-today">
      <h1 class="h-xl">Today</h1>
      <div class="filters" id="todayFilters"></div>
      <div class="cards" id="todayCards"></div>
    </section>

    <section class="view" id="v-challenges" hidden>
      <h1 class="h-xl">New challenge</h1>
      <h2 class="nf-step">What are you making?</h2>
      <div class="types" id="typeCards"></div>
      <form class="newf" id="newForm" hidden autocomplete="off">
        <div class="nf-row" id="nfOwnRow" hidden><h2>Format</h2><div><input id="nfOwn" placeholder="e.g. album cover, menu, packaging"></div></div>
        <h2 class="nf-step">Skills</h2>
        <div class="types two" id="planCards"></div>
        <div class="chips" id="skillChips"></div>
        <div class="nf-row"><h2>Topic <small>optional</small></h2><div><div class="chips" id="ctxChips"></div><input id="nfCtx" placeholder="or type your own, e.g. a bakery"></div></div>
        <div class="nf-row"><h2>Days</h2><div class="seg" data-name="days"><button type="button" value="3">3</button><button type="button" value="5" class="on">5</button><button type="button" value="10">10</button><button type="button" value="30">30</button></div></div>
        <div class="nf-row"><h2>Sprint</h2><div class="seg" data-name="sprint"><button type="button" value="10">10 min</button><button type="button" value="20" class="on">20 min</button><button type="button" value="45">45 min</button></div></div>
        <div class="types two" id="modeCards"></div>
        <button class="btn hot big" type="submit">Start</button>
      </form>
    </section>

    <section class="view" id="v-day" hidden>
      <header class="dayhead">
        <div class="row between"><button class="crumb" data-go="today">← Today</button><span class="daymeta" id="dayMeta"></span></div>
        <div class="steps" id="steps">
          <button class="step" data-step="brief">Brief</button>
          <button class="step" data-step="lesson">Lesson</button>
          <button class="step" data-step="sprint">Sprint</button>
          <button class="step" data-step="submit">Paste up</button>
        </div>
      </header>

      <div class="pane" id="s-brief">
        <p class="kicker" id="pFocus"></p>
        <h1 class="p-title" id="pTitle"></h1>
        <p class="p-brief" id="pBrief"></p>
        <p class="p-con" id="pConstraint"></p>
        <div class="row"><button class="btn" data-step-go="lesson">Lesson</button><button class="btn hot" data-step-go="sprint">Sprint</button><button class="btn quiet" id="duelBtn">Challenge a friend</button><button class="btn hot" id="togetherBtn" hidden>Start together</button><button class="btn quiet" id="inviteBtn" hidden>Invite</button><span class="here" id="duoHere" hidden></span></div>
      </div>

      <div class="pane" id="s-lesson" hidden>
        <div class="l-screen" id="lScreen"></div>
        <div class="l-nav"><button class="btn quiet" id="prevBtn">Prev</button><span id="lCount"></span><button class="btn quiet" id="nextBtn">Next</button></div>
      </div>

      <div class="pane" id="s-sprint" hidden>
        <div class="sprint-grid">
          <div>
            <div class="sp-clock" id="spClock">20:00</div>
            <p class="sp-stage" id="spStage"></p>
            <div class="sp-note" id="spNote"></div>
            <div class="row" id="spCtrl">
              <button class="btn hot" id="spStart">Start</button>
              <button class="btn quiet" id="spPop" hidden>Pop out</button>
              <button class="btn quiet" id="spPause" hidden>Pause</button>
              <button class="btn quiet" id="spNext" hidden>Next</button>
              <button class="btn quiet" id="spReset" hidden>Reset</button>
            </div>
            <div class="sp-hint" id="spHint"></div>
          </div>
          <ol class="sp-stages" id="spStages"></ol>
        </div>
      </div>

      <div class="pane" id="s-submit" hidden>
        <div class="sub-grid">
          <div class="drop" id="drop" tabindex="0">
            <input type="file" id="pieceFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <div class="drop-hint" id="dropHint"><b>Drop your poster</b><span>or click, or paste</span></div>
          </div>
          <form id="reflectForm" class="reflect">
            <label>What did you try?<textarea name="tried" rows="3" required></textarea></label>
            <label>What would you change?<textarea name="change" rows="3" required></textarea></label>
            <button class="btn hot big" type="submit">Paste it up</button>
            <p class="msg" id="saveMsg"></p>
          </form>
        </div>
      </div>

      <div class="pane" id="s-done" hidden>
        <h1 class="p-title">Done.</h1>
        <div class="row"><button class="btn hot" data-go="challenges">New challenge</button><button class="btn quiet" data-go="wall">The wall</button></div>
      </div>
    </section>

    <section class="view wallview" id="v-wall" hidden>
      <header class="wallhead"><h1 class="h-xl">The Wall</h1><p class="wallcount" id="stats"></p></header>
      <div class="wall3d" id="wall3d"></div>
      <div class="wall-scroll" id="wallScroll" hidden><div class="wall" id="wall"></div></div>
    </section>
  </main>
</div>

<div class="fb" id="fb" hidden></div>
<div class="mini" id="mini" hidden></div>
<div class="modal" id="modal" hidden><div class="m-box" id="mBox"></div></div>

<script src="js/lessons.js"></script>
<script src="js/data.js"></script>
<script src="js/db.js"></script>
<script src="js/critique.js"></script>
<script src="js/demo.js"></script>
<script src="js/wall.js"></script>
<script src="js/widget.js"></script>
<script src="js/feedback.js"></script>
<script src="js/app.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/duel.js"></script>
  <script src="js/firebase-config.js"></script>
  <script type="module" src="js/cloud.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module" src="js/wall3d.js"></script>
</body>
</html>
